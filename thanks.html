<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com"></script>

<!-- ==================== Google広告 コンバージョンタグ 貼り付け位置 ==================== -->
<!--
  ここにGoogle広告のコンバージョンタグ(グローバルサイトタグ + イベントスニペット)を貼り付けてください。
  このページの表示自体がコンバージョンとして計測されます。
-->

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ["'Noto Sans JP'", "'Hiragino Sans'", "sans-serif"],
        },
        colors: {
          brand: {
            blue: '#589DF2',
            navy: '#1E293B',
            body: '#334155',
            border: '#E2E8F0',
          }
        }
      }
    }
  }
</script>
<style>
  body { color: #1E293B; }

  /* ===== Section background gradient (Yellow -> White -> Light Blue, left to right) ===== */
  .bg-section-gradient {
    background: linear-gradient(to right, #FEF9C3 0%, #FFFFFF 50%, #E0F2FE 100%);
  }

  /* ===== CTA main button ===== */
  .btn-cta {
    border-radius: 9999px;
    background-color: #589DF2;
    box-shadow: 0 4px 14px rgba(88, 157, 242, 0.4);
    transition: transform 0.2s ease, filter 0.2s ease, background-color 0.2s ease;
  }
  .btn-cta:hover {
    transform: translateY(-2px);
    background-color: #3B82F6;
    filter: brightness(1.05);
  }

  /* ===== Info card ===== */
  .info-card {
    border-radius: 12px;
    border: 1px solid #E2E8F0;
    background-color: #FFFFFF;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
</style>

<body class="font-sans text-[#1E293B] antialiased min-h-screen flex flex-col">

<div class="h-[60px] md:h-[80px]"></div>

<!-- ==================== フッター ==================== -->

</html>
